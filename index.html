<style>

<script>
window.__DEF={"name":"Legnano","lat":45.596,"lon":8.914};window.__RADAR="https://mappe.protezionecivile.gov.it/it/mappe-e-dashboard-rischi/piattaforma-radar/";
function MODELLI() {
  return [
    { id: "italia_meteo_arpae_icon_2i", name: "ICON-2I", who: "ItaliaMeteo · ARPAE", res: "2 km" },
    { id: "icon_d2", name: "ICON-D2", who: "DWD · Germania", res: "2 km" },
    { id: "meteoswiss_icon_ch2", name: "ICON-CH2", who: "MeteoSvizzera", res: "2 km" },
    { id: "icon_eu", name: "ICON-EU", who: "DWD · Europa", res: "7 km" },
    { id: "ecmwf_ifs", alt: "ecmwf_ifs025", name: "ECMWF", who: "Centro europeo", res: "9 km" },
    { id: "ecmwf_aifs025_single", name: "ECMWF AI", who: "Centro europeo · IA", res: "25 km" }
  ];
}

function pesoModello(id, h) {
  switch (id) {
    case "italia_meteo_arpae_icon_2i": return h <= 72 ? 3 : 0;
    case "icon_d2": return h <= 48 ? 2.5 : 0;
    case "meteoswiss_icon_ch2": return h <= 48 ? 2.5 : (h <= 120 ? 1.5 : 0);
    case "icon_eu": return h <= 120 ? 1 : 0;
    case "ecmwf_ifs": return h <= 72 ? 1.5 : 3;
    case "ecmwf_aifs025_single": return h <= 48 ? 1 : 2;
  }
  return 1;
}

function r1(x) { return x == null || isNaN(x) ? null : Math.round(x * 10) / 10; }

function r2(x) { return x == null || isNaN(x) ? null : Math.round(x * 100) / 100; }

function chiaveOra(d) {
  function p(n) { return (n < 10 ? "0" : "") + n; }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":00";
}

function parseLocale(s) {
  var a = s.split("T"), d = a[0].split("-"), t = (a[1] || "00:00").split(":");
  return new Date(+d[0], +d[1] - 1, +d[2], +t[0], +t[1]);
}

async function scaricaMeteo(lat, lon, getJSON) {
  var H = "temperature_2m,apparent_temperature,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m,relative_humidity_2m";
  var pos = "latitude=" + (+lat).toFixed(4) + "&longitude=" + (+lon).toFixed(4) + "&timezone=Europe%2FRome";
  var base = "https://api.open-meteo.com/v1/forecast?" + pos + "&past_days=1&forecast_days=10&hourly=" + H;
  var mods = MODELLI();
  var jobs = mods.map(function (m) {
    return (async function () {
      var ids = [m.id].concat(m.alt ? [m.alt] : []);
      for (var k = 0; k < ids.length; k++) {
        try {
          var j = await getJSON(base + "&models=" + ids[k]);
          if (j && j.hourly && !j.error) return j.hourly;
        } catch (e) {}
      }
      return null;
    })();
  });
  // probabilità da ensemble (30 scenari), giorno/notte, alba/tramonto
  var extraJob = (async function () {
    try {
      return await getJSON("https://api.open-meteo.com/v1/forecast?" + pos +
        "&past_days=1&forecast_days=10&hourly=precipitation_probability,is_day&daily=sunrise,sunset,uv_index_max");
    } catch (e) { return null; }
  })();
  // pioggia ogni 15 minuti (ICON-D2) per le prossime 3 ore
  var nowJob = (async function () {
    try {
      return await getJSON("https://api.open-meteo.com/v1/forecast?" + pos +
        "&minutely_15=precipitation&forecast_minutely_15=12");
    } catch (e) { return null; }
  })();
  var res = await Promise.all(jobs);
  var raw = { models: {}, extra: await extraJob, now15: await nowJob };
  mods.forEach(function (m, i) { raw.models[m.id] = res[i]; });
  return raw;
}

function codiceOra(h) {
  if (h.storm >= 0.35 && h.p >= 0.2) return 95;
  if (h.p >= 0.1 && h.wet >= 0.5) {
    if (h.snow >= 0.5 || h.t <= 0.5) return h.p >= 1.5 ? 75 : 71;
    return h.p >= 4 ? 65 : (h.p >= 1 ? 63 : 61);
  }
  if (h.wet >= 0.3 && h.p >= 0.05) return 51;
  if (h.fog >= 0.5) return 45;
  return h.cloud < 20 ? 0 : h.cloud < 45 ? 1 : h.cloud < 75 ? 2 : 3;
}

function codiceGiorno(d) {
  if (d.storm >= 0.4 && d.p >= 1) return 95;
  if (d.p >= 1 || (d.p >= 0.3 && d.wet >= 0.6)) {
    if (d.snow >= 0.5 || d.tmax <= 1.5) return d.p >= 5 ? 75 : 71;
    return d.p >= 15 ? 65 : (d.p >= 5 ? 63 : 61);
  }
  if (d.p >= 0.2) return 51;
  if (d.fog >= 0.5) return 45;
  return d.cloud < 20 ? 0 : d.cloud < 45 ? 1 : d.cloud < 75 ? 2 : 3;
}

function elabora(raw, place) {
  var mods = MODELLI();
  var ex = raw.extra && raw.extra.hourly ? raw.extra : null;
  var times = ex ? ex.hourly.time : null;
  mods.forEach(function (m) { if (!times && raw.models[m.id]) times = raw.models[m.id].time; });
  if (!times) throw new Error("nessun modello ha risposto");

  var now = new Date();
  var i0 = times.indexOf(chiaveOra(now));
  if (i0 < 0) i0 = 0;
  var VARS = ["temperature_2m", "apparent_temperature", "precipitation", "cloud_cover", "wind_speed_10m", "wind_gusts_10m", "relative_humidity_2m"];
  var all = [];

  for (var i = 0; i < times.length; i++) {
    var lead = Math.max(0, i - i0);
    var acc = {};
    var used = 0;
    var add = function (k, v, w) {
      if (v == null || isNaN(v)) return;
      var a = acc[k] || (acc[k] = { s: 0, w: 0, q: 0 });
      a.s += v * w; a.w += w; a.q += v * v * w;
    };
    for (var pass = 0; pass < 2 && used === 0; pass++) {
      mods.forEach(function (m) {
        var d = raw.models[m.id];
        if (!d || !d.temperature_2m || d.temperature_2m[i] == null) return;
        var w = pass === 0 ? pesoModello(m.id, lead) : 1;
        if (w <= 0) return;
        used++;
        VARS.forEach(function (k) { if (d[k]) add(k, d[k][i], w); });
        var p = d.precipitation ? d.precipitation[i] : null;
        if (p != null) add("wet", p >= 0.1 ? 1 : 0, w);
        var c = d.weather_code ? d.weather_code[i] : null;
        if (c != null) {
          add("storm", c >= 95 ? 1 : 0, w);
          add("fog", (c === 45 || c === 48) ? 1 : 0, w);
          add("snowc", ((c >= 71 && c <= 77) || c === 85 || c === 86) ? 1 : 0, w);
        }
      });
    }
    if (used === 0) { all.push(null); continue; }
    var mean = function (k) { var a = acc[k]; return a && a.w > 0 ? a.s / a.w : null; };
    var sd = function (k) {
      var a = acc[k]; if (!a || a.w <= 0) return 0;
      var mm = a.s / a.w; return Math.sqrt(Math.max(0, a.q / a.w - mm * mm));
    };
    var hh = +times[i].slice(11, 13);
    var wet = mean("wet") || 0;
    var ens = ex && ex.hourly.precipitation_probability ? ex.hourly.precipitation_probability[i] : null;
    var hr = {
      time: times[i], n: used,
      t: r1(mean("temperature_2m")), sd: r1(sd("temperature_2m")),
      app: r1(mean("apparent_temperature")),
      p: r1(mean("precipitation") || 0),
      wet: r2(wet), storm: r2(mean("storm") || 0), fog: r2(mean("fog") || 0), snow: r2(mean("snowc") || 0),
      cloud: Math.round(mean("cloud_cover") || 0),
      wind: Math.round(mean("wind_speed_10m") || 0),
      gust: Math.round(mean("wind_gusts_10m") || 0),
      hum: Math.round(mean("relative_humidity_2m") || 0),
      // probabilità = metà ensemble ECMWF/ICON, metà accordo tra i modelli locali
      prob: Math.round(ens == null ? wet * 100 : (ens + wet * 100) / 2),
      day: ex && ex.hourly.is_day ? ex.hourly.is_day[i] : (hh >= 7 && hh <= 19 ? 1 : 0)
    };
    hr.code = codiceOra(hr);
    all.push(hr);
  }

  // giorni
  var today = times[i0].slice(0, 10), days = [], map = {};
  all.forEach(function (h) {
    if (!h) return;
    var dk = h.time.slice(0, 10);
    if (dk < today) return;
    var d = map[dk];
    if (!d) {
      d = map[dk] = { date: dk, tmin: 99, tmax: -99, p: 0, prob: 0, storm: 0, wet: 0, snow: 0, gust: 0, fs: 0, fn: 0, cs: 0, cn: 0, ss: 0, sn: 0 };
      days.push(d);
    }
    d.tmin = Math.min(d.tmin, h.t); d.tmax = Math.max(d.tmax, h.t);
    d.p += h.p; d.prob = Math.max(d.prob, h.prob); d.storm = Math.max(d.storm, h.storm);
    d.wet = Math.max(d.wet, h.wet); d.gust = Math.max(d.gust, h.gust);
    if (h.p >= 0.1) d.snow = Math.max(d.snow, h.snow);
    var hh = +h.time.slice(11, 13);
    if (hh >= 6 && hh <= 11) { d.fs += h.fog; d.fn++; }
    if (hh >= 8 && hh <= 19) { d.cs += h.cloud; d.cn++; }
    d.ss += h.sd; d.sn++;
  });
  days.forEach(function (d) {
    d.p = r1(d.p);
    d.cloud = d.cn ? d.cs / d.cn : 50;
    d.fog = d.fn ? d.fs / d.fn : 0;
    d.sd = r1(d.sn ? d.ss / d.sn : 0);
    d.code = codiceGiorno(d);
    d.tmin = Math.round(d.tmin); d.tmax = Math.round(d.tmax);
    ["fs", "fn", "cs", "cn", "ss", "sn"].forEach(function (k) { delete d[k]; });
  });

  // ore di oggi e domani (anche quelle già passate) per il quadrante
  var clock = all.filter(function (h) { return h && h.time.slice(0, 10) >= today; }).slice(0, 48)
    .map(function (h) { return { time: h.time, code: h.code, day: h.day, t: h.t, p: h.p }; });

  var hours = all.slice(i0).filter(Boolean);
  var h0 = hours[0], h1 = hours[1] || hours[0];
  var tNow = h0.t + (h1.t - h0.t) * (now.getMinutes() / 60);

  // fiducia: quanto i modelli sono d'accordo nelle prossime 24 ore
  var nx = hours.slice(0, 24), sSd = 0, sDis = 0;
  nx.forEach(function (h) { sSd += h.sd; sDis += 4 * h.wet * (1 - h.wet); });
  var mSd = sSd / nx.length, mDis = sDis / nx.length;
  var conf = h0.n >= 2 ? Math.max(0, Math.min(10, 10 - 1.5 * mSd - 6 * mDis)) : null;

  // riepilogo per modello
  var tot = 0;
  var ms = mods.map(function (m) {
    var d = raw.models[m.id];
    var ok = !!(d && d.temperature_2m && d.temperature_2m[i0] != null);
    var w = ok ? pesoModello(m.id, 0) : 0;
    tot += w;
    var p24 = 0;
    if (ok && d.precipitation) for (var k = i0; k < i0 + 24 && k < d.precipitation.length; k++) p24 += d.precipitation[k] || 0;
    return { id: m.id, name: m.name, who: m.who, res: m.res, ok: ok, t: ok ? r1(d.temperature_2m[i0]) : null, p24: r1(p24), w: w };
  });
  ms.forEach(function (m) { m.share = tot ? Math.round(m.w / tot * 100) : 0; });

  // pioggia nei prossimi 15-180 minuti
  var nc = null;
  if (raw.now15 && raw.now15.minutely_15 && raw.now15.minutely_15.precipitation) {
    var mt = raw.now15.minutely_15.time, mp = raw.now15.minutely_15.precipitation;
    var raining = (mp[0] || 0) >= 0.1, startMin = null, stopMin = null;
    for (var k = 0; k < mp.length; k++) {
      var mins = Math.max(0, Math.round((parseLocale(mt[k]) - now) / 60000));
      if (!raining && startMin == null && (mp[k] || 0) >= 0.1) startMin = mins;
      if (raining && stopMin == null && (mp[k] || 0) < 0.05) stopMin = mins;
    }
    nc = { raining: raining, startMin: startMin, stopMin: stopMin };
  }

  var sun = null;
  if (raw.extra && raw.extra.daily && raw.extra.daily.time) {
    var di = raw.extra.daily.time.indexOf(today);
    if (di >= 0) sun = {
      rise: (raw.extra.daily.sunrise[di] || "").slice(11, 16),

function priorita(c) {
  if (c >= 95) return 9;
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 8;
  if (c >= 61) return 7;
  if (c >= 51) return 6;
  if (c === 45 || c === 48) return 5;

}

function orologio(f) {
  var now = new Date(), H = now.getHours(), src = f.clock || f.hours, segs = [];
  for (var k = 0; k < 12; k++) {
    var off = (k - (H % 12) + 12) % 12, abs = H + off;

    for (var j = 0; j < src.length; j++) if (src[j].time === tk) { h = src[j]; break; }
    segs.push({ k: k, hour: hh, time: tk, h: h, off: off, now: off === 0 });
  }

}

function tipo(code, giorno) {
  if (code >= 95) return { k: "storm", label: "Temporale", col: "#EE97BA" };
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return { k: "snow", label: "Neve", col: "#D3E0F4" };
  if (code >= 80) return { k: "rain", label: "Rovesci", col: "#F2B5CF" };
  if (code >= 61) return { k: "rain", label: code >= 65 ? "Pioggia forte" : (code >= 63 ? "Pioggia" : "Pioggia debole"), col: "#F2B5CF" };
  if (code >= 51) return { k: "drizzle", label: "Qualche goccia", col: "#F2B5CF" };
  if (code === 45 || code === 48) return { k: "fog", label: "Nebbia", col: "#BCCDEB" };
  if (code === 3) return { k: "cloud", label: "Nuvoloso", col: "#BCCDEB" };
  if (code === 2) return { k: "part", label: "Variabile", col: "#A9B76F" };
  if (code === 1) return { k: giorno ? "part" : "moon", label: "Poco nuvoloso", col: "#F4D46E" };

function fmtMin(m) {
  if (m < 60) return m + " min";

}

function consiglio(f) {

    return nc.stopMin != null ? "Sta piovendo: dovrebbe smettere <b>tra " + fmtMin(nc.stopMin) + "</b>"
      : "Sta piovendo e <b>continua</b> per almeno 3 ore";
  }
  if (nc && nc.startMin != null) return "Pioggia in arrivo <b>tra " + fmtMin(nc.startMin) + "</b>";
  for (var k = 0; k < Math.min(24, f.hours.length); k++) {
    var h = f.hours[k];
    if (h.wet >= 0.5 && h.p >= 0.2) {
      return (h.storm >= 0.35 ? "Temporale" : "Pioggia") + " dalle <b>" + h.time.slice(11, 16) + "</b>, probabilità <b>" + h.prob + "%</b>";
    }

      html += '<div class="row place' + (S.active === i ? " on" : "") + '" data-act="sel:' + i + '"><div class="ic" style="background:#F2B5CF">' + svgI(I.pin, 19) + '</div>' +
        '<div class="mid"><div class="name">' + esc(p.name) + '</div><div class="s">' + (p.sub ? esc(p.sub) : p.lat.toFixed(3) + ", " + p.lon.toFixed(3)) + '</div></div>' +
        '<button class="del" data-act="del:' + i + '">' + svgI(I.x, 16, 2.2) + '</button></div>';
    });
    html += '<button class="pill addbtn" data-act="add">+ Aggiungi luogo</button>';
    html += '<div class="note">Il widget segue il luogo attivo. Per fissare un widget su un luogo, scrivi il nome nel campo "Parameter" del widget.</div>';
    return html;
  }

  function render() {
    var app = document.getElementById("app");
    app.innerHTML = view === "giorni" ? giorniView() : view === "modelli" ? modelliView() : view === "luoghi" ? luoghiView() : home();
    var tabs = [["home", I.home], ["giorni", I.cal], ["modelli", I.layers], ["luoghi", I.pin]];
    document.getElementById("tab").innerHTML = tabs.map(function (t) {
      return '<button class="' + (view === t[0] ? "on" : "") + '" data-act="go:' + t[0] + '">' + svgI(t[1], 23) + '</button>';
    }).join("");
  }

  // ── fogli ──
  function chiudiSheet() { document.getElementById("sheet").innerHTML = ""; }
  function info() {
    document.getElementById("sheet").innerHTML = '<div class="bg" data-act="close"></div><div class="sh"><h3>Da dove arrivano i dati <button class="del" data-act="close">' + svgI(I.x, 16, 2.2) + '</button></h3>' +
      '<p>La temperatura e il resto sono la media pesata di sei modelli: ICON-2I (ItaliaMeteo-ARPAE, 2 km), ICON-D2 e ICON-EU (servizio meteo tedesco), ICON-CH2 (MeteoSvizzera), ECMWF e ECMWF AI (Centro europeo).</p>' +
      '<p>L’anello è un orologio che mostra sempre le prossime 12 ore: ogni posizione indica la prossima volta che arriva quell’ora (il numero accanto è l’ora in formato 24 h). L’ora in corso ha l’icona nera, il puntino rosa segna l’ora esatta e da lì si gira in senso orario. Tocca uno spicchio per i dettagli.</p>' +
      '<p>Radar: piattaforma ufficiale della Protezione Civile.</p>' +
      '<p class="s">Dati: Open-Meteo.com (CC BY 4.0) · ICON-2I © ItaliaMeteo-ARPAE (CC BY 4.0) · DWD · MeteoSvizzera · ECMWF.</p></div>';
  }
  var risultati = [], qTimer = null;
  function apriAggiungi() {
    document.getElementById("sheet").innerHTML = '<div class="bg" data-act="close"></div><div class="sh"><h3>Aggiungi luogo <button class="del" data-act="close">' + svgI(I.x, 16, 2.2) + '</button></h3>' +
      '<input class="inp" id="q" placeholder="Cerca un comune…" autocomplete="off" autocorrect="off"><div id="res"></div></div>';
    var q = document.getElementById("q");
    q.focus();
    q.addEventListener("input", function () {
      clearTimeout(qTimer);
      var v = q.value.trim();
      if (v.length < 2) { document.getElementById("res").innerHTML = ""; return; }
      qTimer = setTimeout(function () { cerca(v); }, 300);
    });
  }
  function cerca(v) {
    getJSON("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(v) + "&count=8&language=it&format=json").then(function (j) {
      risultati = (j && j.results) || [];
      document.getElementById("res").innerHTML = risultati.length ? risultati.map(function (r, i) {
        return '<div class="res" data-act="pick:' + i + '"><b>' + esc(r.name) + '</b><span>' + esc([r.admin2, r.admin1, r.country].filter(Boolean).join(", ")) + '</span></div>';
      }).join("") : '<div class="res"><span>Nessun risultato</span></div>';
    }).catch(function () {
      document.getElementById("res").innerHTML = '<div class="res"><span>Ricerca non disponibile</span></div>';
    });
  }

  // ── navigazione ──
  function vai(v) {
    if (v === view) return;
    if (v === "home") pila = []; else pila.push(view);
    view = v; render(); window.scrollTo(0, 0);
  }
  function indietro() {
    if (view === "home") return;
    view = pila.pop() || "home"; render(); window.scrollTo(0, 0);
  }

  // ── gesti: swipe a destra = indietro, tira giù = aggiorna ──
  var app = document.getElementById("app"), pull = document.getElementById("pull");
  var g = null, caricando = false;
  function sheetAperto() { return !!document.getElementById("sheet").innerHTML; }
  function posa(el, tr, anim) {
    el.style.transition = anim ? "transform .25s ease, opacity .25s ease" : "none";
    el.style.transform = tr;
  }
  document.addEventListener("touchstart", function (e) {
    if (sheetAperto() || e.touches.length > 1) { g = null; return; }
    var t = e.touches[0];
    g = { x: t.clientX, y: t.clientY, dx: 0, dy: 0, mode: null, top: window.scrollY <= 0 };
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (!g) return;
    var t = e.touches[0];
    g.dx = t.clientX - g.x; g.dy = t.clientY - g.y;
    if (!g.mode) {
      var ax = Math.abs(g.dx), ay = Math.abs(g.dy);
      if (ax < 8 && ay < 8) return;
      if (view !== "home" && g.dx > 0 && ax > ay * 1.4) g.mode = "back";
      else if (g.top && !caricando && g.dy > 0 && ay > ax) g.mode = "pull";
      else g.mode = "none";
    }
    if (g.mode === "back") {
      e.preventDefault();
      var d = Math.max(0, g.dx);
      posa(app, "translateX(" + d + "px)");
      app.style.opacity = String(1 - Math.min(0.5, d / 700));
    } else if (g.mode === "pull") {
      e.preventDefault();
      var p = Math.min(120, g.dy * 0.5);
      posa(app, "translateY(" + p + "px)");
      posa(pull, "translate(-50%," + (p - 50) + "px) rotate(" + (p * 4) + "deg)");
      pull.style.opacity = String(Math.min(1, p / 60));
      pull.classList.toggle("ok", p >= 64);
    }
  }, { passive: false });
  document.addEventListener("touchend", function () {
    if (!g) return;
    var m = g.mode, dx = g.dx, dy = g.dy;
    g = null;
    if (m === "back") {
      if (dx > 90) {
        posa(app, "translateX(100%)", true); app.style.opacity = "0";
        setTimeout(function () {
          indietro();
          posa(app, "translateX(-30px)"); app.style.opacity = "0";
          requestAnimationFrame(function () { posa(app, "none", true); app.style.opacity = "1"; });
        }, 200);
      } else { posa(app, "none", true); app.style.opacity = "1"; }
    } else if (m === "pull") {
      if (dy * 0.5 >= 64) {
        caricando = true;
        posa(app, "translateY(56px)", true);
        posa(pull, "translate(-50%,6px)", true);
        pull.classList.add("spin"); pull.style.opacity = "1";
        Promise.resolve(ricarica()).catch(function () {}).then(function () {
          caricando = false;
          pull.classList.remove("spin", "ok");
          posa(app, "none", true);
          posa(pull, "translate(-50%,-50px)", true); pull.style.opacity = "0";
        });
      } else {
        posa(app, "none", true);
        posa(pull, "translate(-50%,-50px)", true); pull.style.opacity = "0";
      }
    }
  });

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var a = el.getAttribute("data-act").split(":"), c = a[0], v = a[1];
    if (c === "go") vai(v);
    else if (c === "back") indietro();
    else if (c === "hr") {
      var s = orologio(F).segs[+v];
      if (s && s.h) toast(s.time.slice(11, 16) + " · " + tipo(s.h.code, s.h.day).label + " · " + r0(s.h.t) + "°" + (s.h.p >= 0.1 ? " · " + f1(s.h.p) + " mm" : ""), 2200);
    }
    else if (c === "info") info();
    else if (c === "close") chiudiSheet();
    else if (c === "radar") { window.__Q.push({ open: window.__RADAR }); toast("Apro il radar…", 1500); }
    else if (c === "gps") { S.active = "gps"; salva(); chiediGps(); vai("home"); }
    else if (c === "more") { tutti = !tutti; render(); }
    else if (c === "add") apriAggiungi();
    else if (c === "sel") {
      if (v === "gps") { S.active = "gps"; salva(); chiediGps(); }
      else { S.active = +v; salva(); caricaLuogo(S.places[+v]); }
      vai("home");
    }
    else if (c === "del") {
      e.stopPropagation();
      var i = +v;
      S.places.splice(i, 1);
      if (S.active === i) { S.active = "gps"; chiediGps(); }
      else if (typeof S.active === "number" && S.active > i) S.active--;
      salva(); render();
    }
    else if (c === "pick") {
      var r = risultati[+v];
      if (!r) return;
      S.places.push({ name: r.name, sub: [r.admin2 || r.admin1, r.country].filter(Boolean).join(", "), lat: r.latitude, lon: r.longitude });
      S.active = S.places.length - 1; salva();
      chiudiSheet(); vai("home");
      caricaLuogo(S.places[S.active]);
    }
  });

  render();
  // apertura veloce: la pagina parte coi dati salvati e si aggiorna da sola
  if (window.__AUTO) ricarica();
}

// ── adattatore web: salva su questo telefono, GPS del browser, radar ──
(function () {
  var KS = "meteo-davide-stato", KC = "meteo-davide-cache";
  function leggi(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function salva(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function getJSON(u) { return fetch(u).then(function (r) { return r.json(); }); }
  function posizione() {
    return new Promise(function (res) {
      if (!navigator.geolocation) return res(null);
      navigator.geolocation.getCurrentPosition(function (p) {
        var lat = p.coords.latitude, lon = p.coords.longitude;
        getJSON("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" + lat + "&longitude=" + lon + "&localityLanguage=it")
          .then(function (j) { res({ name: (j && (j.city || j.locality)) || "Posizione attuale", lat: lat, lon: lon }); })
          .catch(function () { res({ name: "Posizione attuale", lat: lat, lon: lon }); });
      }, function () { res(null); }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 });
    });
  }
  var st = leggi(KS);
  if (!st || !Array.isArray(st.places)) st = { places: [window.__DEF], active: "gps", lastGps: null };
  window.__STATE = st;
  window.__Q = [];
  // stessa "coda" usata dallo script Scriptable
  setInterval(function () {
    salva(KS, window.__STATE);
    var q = (window.__Q || []).splice(0);
    q.forEach(function (it) {
      if (it.open) window.location.href = it.open;
      if (it.cache && window.__DATA) salva(KC, window.__DATA);
      if (it.gps) posizione().then(function (g) { if (window.__gps) window.__gps(g); });
    });
  }, 400);

  function avvia() {
    document.getElementById("boot").remove();
    CLIENT();
  }
  var cache = leggi(KC);
  if (cache && cache.hours && cache.hours.length) {
    window.__DATA = cache; window.__AUTO = 1; avvia(); return;
  }
  // primo avvio: niente dati salvati
  window.__AUTO = 0;
  (async function primo() {
    var p = null;
    if (st.active === "gps") { p = await posizione(); if (p) { st.lastGps = p; salva(KS, st); } }
    if (!p) p = st.active === "gps" ? (st.lastGps || st.places[0] || window.__DEF) : (st.places[st.active] || window.__DEF);
    try {
      var f = elabora(await scaricaMeteo(p.lat, p.lon, getJSON), p);
      salva(KC, f); window.__DATA = f; avvia();
    } catch (e) {
      document.getElementById("boot").innerHTML = '<p>Non riesco a scaricare le previsioni.</p><button class="pill" onclick="location.reload()">Riprova</button>';
    }
  })();
})();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script></body></html>
